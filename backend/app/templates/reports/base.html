<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>{{ title }}</title>
<style>
  @font-face {
    font-family: 'NotoSansCJK';
    src: url('file:///usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc') format('truetype');
    font-weight: normal;
  }
  @font-face {
    font-family: 'NotoSansCJK';
    src: url('file:///usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc') format('truetype');
    font-weight: bold;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'NotoSansCJK', 'Noto Sans CJK TC', sans-serif;
    font-size: 10pt;
    line-height: 1.6;
    color: #1a1a1a;
    background: white;
  }

  @page {
    size: A4;
    margin: 2cm 2.5cm 2.5cm 2.5cm;
    @bottom-center {
      content: "第 " counter(page) " 頁，共 " counter(pages) " 頁";
      font-family: 'NotoSansCJK', sans-serif;
      font-size: 8pt;
      color: #888;
    }
    @top-right {
      content: "{{ case_name }} ｜ 共親職排程紀錄";
      font-family: 'NotoSansCJK', sans-serif;
      font-size: 8pt;
      color: #888;
    }
  }

  .cover {
    page-break-after: always;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 240mm;
    text-align: center;
  }
  .cover .logo { font-size: 14pt; color: #4a6fa5; margin-bottom: 16pt; }
  .cover h1 { font-size: 20pt; font-weight: bold; margin-bottom: 8pt; }
  .cover .subtitle { font-size: 12pt; color: #555; margin-bottom: 32pt; }
  .cover .meta-table { margin: 0 auto; text-align: left; }
  .cover .meta-table td { padding: 3pt 12pt 3pt 0; }
  .cover .meta-table .label { color: #888; }
  .cover .integrity-box {
    margin-top: 32pt;
    padding: 12pt;
    border: 1pt solid #d0d0d0;
    background: #f8f8f8;
    font-size: 8pt;
    color: #555;
    text-align: left;
    word-break: break-all;
  }

  h2 {
    font-size: 13pt;
    font-weight: bold;
    color: #4a6fa5;
    border-bottom: 1.5pt solid #4a6fa5;
    padding-bottom: 4pt;
    margin: 18pt 0 10pt 0;
  }
  h3 { font-size: 11pt; font-weight: bold; margin: 12pt 0 6pt 0; }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 12pt;
    font-size: 9pt;
  }
  thead th {
    background: #4a6fa5;
    color: white;
    padding: 5pt 8pt;
    text-align: left;
    font-weight: bold;
  }
  tbody tr:nth-child(even) { background: #f2f6fb; }
  tbody td { padding: 4pt 8pt; border-bottom: 0.5pt solid #e0e0e0; }

  .badge {
    display: inline-block;
    padding: 1pt 5pt;
    border-radius: 3pt;
    font-size: 8pt;
    font-weight: bold;
  }
  .badge-completed { background: #d4edda; color: #155724; }
  .badge-missed    { background: #f8d7da; color: #721c24; }
  .badge-disputed  { background: #fff3cd; color: #856404; }
  .badge-scheduled { background: #e2e3e5; color: #383d41; }
  .badge-cancelled { background: #e2e3e5; color: #6c757d; }

  .disclaimer {
    margin-top: 24pt;
    padding: 10pt;
    border-left: 3pt solid #f0ad4e;
    background: #fffbf0;
    font-size: 8pt;
    color: #666;
  }

  .page-break { page-break-before: always; }
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
